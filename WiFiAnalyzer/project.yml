name: WiFiAnalyzer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WiFiAnalyzer:
    type: application
    platform: iOS
    sources:
      - path: WiFiAnalyzer
    info:
      path: WiFiAnalyzer/Info.plist
      properties:
        CFBundleDisplayName: Wi-Fi Analyzer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: iOS only reveals the name (SSID) and BSSID of the connected Wi-Fi network to apps with location access. Your location is never stored or sent anywhere.
        NSLocalNetworkUsageDescription: Wi-Fi Analyzer scans your local network to discover devices and measure latency to your router.
        NSBonjourServices:
          - _http._tcp
          - _airplay._tcp
          - _raop._tcp
          - _googlecast._tcp
          - _ipp._tcp
          - _printer._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _ssh._tcp
          - _hap._tcp
          - _companion-link._tcp
          - _spotify-connect._tcp
    entitlements:
      path: WiFiAnalyzer/WiFiAnalyzer.entitlements
      properties:
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.wifianalyzer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
